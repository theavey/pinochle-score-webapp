# Version updates wait out a cooldown so a compromised or broken release has
# time to be caught and yanked before we pick it up. Cooldown never applies to
# Dependabot *security* updates, which open as soon as a fix is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet (peer range <6.1).
      # Remove this once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types follow the runtime in .nvmrc; bump both together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
